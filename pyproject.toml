[project]
name = "pyrovigil"
version = "0.1.0"
description = "Détection de signaux de feux de forêt en France à partir de données satellite ouvertes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "shapely>=2.0",
]

[project.scripts]
pyrovigil = "pyrovigil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrovigil"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
